[package]
name = "stencild"
version = "0.1.0"
edition = "2021"
description = "Interface service for Stencild e-ink panels (bq Cervantes 2)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serialport = "4"
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"

[features]
default = []
tray = []
